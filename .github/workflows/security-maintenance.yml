name: Security maintenance
on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/security-maintenance.yml'
      - '.github/dependabot.yml'
      - '.node-version'
      - 'runtime-security.json'
      - 'scripts/security-runtime.ts'
      - 'scripts/check-bundle.ts'
      - 'tests/security-runtime.test.ts'
      - 'examples/http/bounded-fetch.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: security-maintenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  npm_config_ignore_scripts: 'true'

jobs:
  advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
      - name: Check runtime and official security releases
        run: node --experimental-strip-types scripts/security-runtime.ts --online --inventory
      - run: npm install --global pnpm@11.28.8 --ignore-scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.node-version'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --audit-level=high

  runtime-contract:
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        node: ['24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Check runtime policy without dependencies
        run: node --experimental-strip-types scripts/security-runtime.ts --inventory
      - name: Test policy failure boundaries
        run: node --experimental-strip-types --test tests/security-runtime.test.ts
